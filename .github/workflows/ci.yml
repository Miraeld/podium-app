name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A new push to the same branch supersedes the previous run — don't let
# stale runs keep burning runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (build + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      # P8: client builds MUST fail without PODIUM_APP_VERSION set (never
      # weaken this guard). "build" is `tsc -b && vite build` — the
      # type-check is already part of the build step, there's no separate
      # "typecheck" script in client/package.json.
      - name: Build (typecheck + bundle)
        env:
          PODIUM_APP_VERSION: ci
        run: npm run build

  server:
    name: Server (node:test incl. contract gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # install-hooks.js resolves the podium-hook binary and — after the
      # hook-wiring fix (04cac9e) — installs NOTHING (with a stderr warning)
      # when no binary is found. The install-hooks suite therefore needs
      # hook/dist/podium-hook present, exactly as a developer has it locally
      # (its absence in CI is what made these tests pass locally but fail on
      # the first hosted run). Build it before the suite so the tests exercise
      # the REAL resolution against a REAL binary. Cheap: one bun compile.
      - name: Build hook binary (install-hooks tests depend on it)
        working-directory: hook
        run: bun install && bun run build
      # `npm test` = node --test __tests__/*.test.js tests/contract/*.test.js
      # (N4) — 558 tests total, including the wire-format contract gate that
      # boots a real server and asserts every response shape against
      # client/src/lib/types.ts. Some upstream suites (ccam-cli,
      # hook-handler, plugins-marketplace — dormant, never-ported scaffolding
      # per ROADMAP §F EXTRAS policy) are `{ skip }`'d with a documented
      # reason in the test files themselves — that's the CI truth policy in
      # practice: a node:test skip must name what's being skipped and why,
      # never a silent deletion, and never used to paper over a runner-only
      # flake without the reason being visible in the diff.
      #
      # CI truth policy (see CLAUDE.md): if a test ever fails ONLY on GitHub-
      # hosted runners (not locally, not in local Linux docker) because of
      # runner-environment behavior, gate it with `{ skip: 'reason' }` and a
      # comment naming the observed runner behavior — never delete it, never
      # skip unconditionally, never gate a test that also fails locally.
      - name: Test
        run: npm test

  tauri:
    name: Tauri shell (cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tauri/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libayatana-appindicator3-dev
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      # `cargo check` verifies the Rust shell compiles. tauri's build.rs
      # resolves the externalBin sidecars (bin/podium-server-<triple>,
      # bin/podium-hook-<triple>) and the web-dist/ resources dir at build
      # time and hard-errors if any are absent — and all three are gitignored,
      # so they don't exist on a fresh CI checkout. Building the real
      # bun-compiled sidecars + client bundle is release.yml's job (minutes,
      # ~125MB of binaries); for a pure compile check, zero-byte placeholders
      # at the expected paths satisfy the existence check without that cost.
      - name: Stage sidecar + resource placeholders (compile-check only)
        run: |
          TRIPLE="$(rustc -vV | awk '/^host:/ { print $2 }')"
          mkdir -p bin web-dist
          touch "bin/podium-server-$TRIPLE" "bin/podium-hook-$TRIPLE"
          touch web-dist/index.html
      - name: cargo check
        run: cargo check
