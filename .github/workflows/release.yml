name: Release

on:
  push:
    tags: ["v*"]

# One release build per tag — tags are one-shot, but this still guards
# against a rapid re-push of the same tag (force-push) racing itself.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos:
    name: macOS (Tauri .dmg)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      # N5-A: podium-server is now a bun-compiled sidecar (not a Swift
      # binary) — tauri/prepare-sidecar.sh needs bun on PATH to run
      # `bun install --production` + `bun build --compile`.
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Strip leading "v" from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # tauri.conf.json's "version" is stamped from the tag so the .dmg /
      # .app Info.plist and the (future) T2.3 updater manifest all agree
      # with the GitHub release tag.
      - name: Stamp Tauri app version from tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd tauri/src-tauri
          jq --arg v "$VERSION" '.version = $v' tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp tauri.conf.json
      # P8: the client build embedded in the app MUST be stamped with the
      # real release version too — client/dist is what prepare-sidecar.sh
      # stages into the Tauri bundle as a resource (see tauri/README.md's
      # "--web-dist wire-up" section). Build it explicitly here with the
      # release version before staging, rather than relying on whatever
      # (if anything) happens to already be in client/dist.
      - name: Build client (PODIUM_APP_VERSION stamped)
        env:
          PODIUM_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd client
          npm ci
          npm run build
      - name: Build + stage podium-server sidecar (+ client/dist)
        env:
          # T2.3 sidecar version-string fix: bakes the real release version
          # into the compiled server binary (see prepare-sidecar.sh) instead
          # of it reporting "dev".
          PODIUM_APP_VERSION: ${{ steps.version.outputs.version }}
        run: tauri/prepare-sidecar.sh
      # icons/ is git-ignored (build artifact); cargo tauri build panics
      # without it (verified locally — "failed to open icon .../32x32.png").
      - name: Generate app icons
        run: |
          cd tauri
          cargo tauri icon src-tauri/icon-source.png
      # T2.3: signing env vars activate tauri.conf.json's
      # createUpdaterArtifacts, so this also emits the .app.tar.gz + .sig
      # updater artifacts alongside the .app/.dmg.
      - name: Build Tauri app (.app + .dmg)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd tauri
          cargo tauri build --bundles app,dmg
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            tauri/src-tauri/target/release/bundle/dmg/*.dmg
            tauri/src-tauri/target/release/bundle/macos/*.app.tar.gz
            tauri/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  linux:
    name: Linux (Tauri .AppImage + .deb)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # GitHub's ubuntu-latest runners are x86_64. `bun build --compile`
      # defaults to compiling for the machine it runs on, so a plain
      # (non-cross) compile here already produces an x86_64 Linux binary —
      # exactly what most Linux desktop users want. No --target flag is
      # needed unless this job is ever changed to cross-compile from a
      # different host arch (e.g. an aarch64 runner); if that happens, pass
      # `--target=bun-linux-x64` explicitly to tauri/prepare-sidecar.sh's
      # `bun build --compile` invocation rather than relying on the host
      # default.
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            patchelf \
            file \
            fuse \
            libfuse2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Strip leading "v" from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Stamp Tauri app version from tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd tauri/src-tauri
          jq --arg v "$VERSION" '.version = $v' tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp tauri.conf.json
      - name: Build client (PODIUM_APP_VERSION stamped)
        env:
          PODIUM_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd client
          npm ci
          npm run build
      - name: Build + stage podium-server sidecar (+ client/dist)
        env:
          # T2.3 sidecar version-string fix — see the macOS job's identical step.
          PODIUM_APP_VERSION: ${{ steps.version.outputs.version }}
        run: tauri/prepare-sidecar.sh
      # icons/ is git-ignored (build artifact); a fresh CI checkout never has
      # it, so always regenerate (see the macOS job's identical step).
      - name: Generate app icons
        run: |
          cd tauri
          cargo tauri icon src-tauri/icon-source.png
      # .deb first: Tauri's deb bundler doesn't involve linuxdeploy, so a
      # linuxdeploy/AppImage failure can never block the .deb (or the whole
      # release). The cargo build is shared — the AppImage step below reuses it.
      # T2.3: signing env vars so the .deb build also signs whatever updater
      # artifacts Tauri emits for this bundle target (Linux updater support
      # is best-effort/AppImage-only in practice, but harmless to pass here).
      - name: Build Tauri app (.deb)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd tauri
          cargo tauri build --bundles deb
      # AppImage is best-effort until the linuxdeploy failure is understood:
      # "failed to run linuxdeploy" (runs 29428948113 + 29438033805, both
      # with fuse+libfuse2 installed and the second with NO_STRIP=true) hides
      # the underlying error at default verbosity — --verbose surfaces
      # linuxdeploy's own log. v0.5.3 bundled fine on the same yml before the
      # two ~63MB bun sidecars entered the bundle; suspicion is on how
      # linuxdeploy processes those. continue-on-error keeps dmg+deb releases
      # flowing while the verbose log gives the real diagnosis; the AppImage
      # rejoins the release the moment the root cause lands. NO_STRIP kept —
      # stripping the sidecars is pointless (their bulk is embedded blob).
      - name: Build Tauri app (.AppImage, best-effort + verbose)
        continue-on-error: true
        env:
          NO_STRIP: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd tauri
          cargo tauri build --bundles appimage --verbose
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          # deb is mandatory (if-no-files-found: error still bites when it's
          # missing); the AppImage globs (including the T2.3 updater
          # artifacts) simply match nothing when that best-effort step failed.
          path: |
            tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            tauri/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            tauri/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
            tauri/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: artifacts
      # Single source of truth for the changelog: GitHub's own auto-generated
      # notes (merged PRs/commits since the previous tag), generated once
      # here and reused both for latest.json's `notes` field (what the
      # native updater dialog shows, T2.4) and the GitHub release body below
      # — rather than generating it twice via two different mechanisms and
      # letting them drift apart. Written to a file (not a GITHUB_OUTPUT
      # var) because release notes can contain characters/length that don't
      # survive the output-variable round trip cleanly.
      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="${{ github.ref_name }}" --jq '.body' > release-notes.txt; then
            echo "Generated release notes ($(wc -c < release-notes.txt) bytes)."
          else
            echo "::warning::gh api generate-notes failed; falling back to a generic notes string."
            echo "Podium ${GITHUB_REF_NAME#v}" > release-notes.txt
          fi
      # T2.3: build the updater manifest BEFORE creating the release, so
      # latest.json can be included in the same `gh release create` upload
      # as the .app.tar.gz (and, best-effort, .AppImage.tar.gz) it points
      # at. The URL filenames below MUST exactly match what gets uploaded —
      # GitHub preserves whatever filename is passed to `gh release create`,
      # so they're derived from the very same `find` results used for the
      # asset list.
      - name: Generate latest.json updater manifest
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          NOTES="$(cat release-notes.txt)"

          MAC_TAR="$(find artifacts -type f -name '*.app.tar.gz' | head -n1)"
          MAC_SIG="$(find artifacts -type f -name '*.app.tar.gz.sig' | head -n1)"
          test -n "$MAC_TAR" || { echo "::error::no .app.tar.gz updater artifact found under artifacts/"; exit 1; }
          test -n "$MAC_SIG" || { echo "::error::no .app.tar.gz.sig updater artifact found under artifacts/"; exit 1; }
          MAC_SIGNATURE="$(cat "$MAC_SIG")"
          MAC_FILENAME="$(basename "$MAC_TAR")"
          MAC_URL="https://github.com/Miraeld/podium-app/releases/download/${GITHUB_REF_NAME}/${MAC_FILENAME}"

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --arg mac_sig "$MAC_SIGNATURE" \
            --arg mac_url "$MAC_URL" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"darwin-aarch64": {signature: $mac_sig, url: $mac_url}}}' \
            > latest.json.tmp

          # Linux AppImage updater artifacts are best-effort (see the linux
          # job's continue-on-error step) — only add the linux-x86_64 entry
          # if they actually made it into this release's artifacts.
          LINUX_TAR="$(find artifacts -type f -name '*.AppImage.tar.gz' | head -n1)"
          LINUX_SIG="$(find artifacts -type f -name '*.AppImage.tar.gz.sig' | head -n1)"
          if [ -n "$LINUX_TAR" ] && [ -n "$LINUX_SIG" ]; then
            LINUX_SIGNATURE="$(cat "$LINUX_SIG")"
            LINUX_FILENAME="$(basename "$LINUX_TAR")"
            LINUX_URL="https://github.com/Miraeld/podium-app/releases/download/${GITHUB_REF_NAME}/${LINUX_FILENAME}"
            jq \
              --arg sig "$LINUX_SIGNATURE" \
              --arg url "$LINUX_URL" \
              '.platforms["linux-x86_64"] = {signature: $sig, url: $url}' \
              latest.json.tmp > latest.json.tmp2
            mv latest.json.tmp2 latest.json.tmp
          else
            echo "No linux AppImage updater artifact found — omitting linux-x86_64 from latest.json (best-effort)."
          fi

          mv latest.json.tmp latest.json
          echo "Generated latest.json:"; cat latest.json
      - name: Create GitHub release (draft)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # download-artifact preserves each artifact's internal layout, and the
          # Linux job uploads two paths (appimage/ + deb/) so its files land under
          # artifacts/appimage/ and artifacts/deb/, not flat. Collect recursively
          # so the nesting doesn't matter. Includes the T2.3 updater artifacts
          # (.app.tar.gz[.sig], .AppImage.tar.gz[.sig]) alongside the installers.
          mapfile -t assets < <(find artifacts -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name '*.AppImage.tar.gz' -o -name '*.AppImage.tar.gz.sig' \))
          assets+=("latest.json")
          echo "Attaching ${#assets[@]} assets:"; printf '  %s\n' "${assets[@]}"
          test "${#assets[@]}" -gt 0 || { echo "::error::no release assets found under artifacts/"; exit 1; }
          gh release create "${{ github.ref_name }}" "${assets[@]}" \
            --draft \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.txt
