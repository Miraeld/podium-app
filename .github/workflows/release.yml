name: Release

on:
  push:
    tags: ["v*"]

# One release build per tag — tags are one-shot, but this still guards
# against a rapid re-push of the same tag (force-push) racing itself.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  macos:
    name: macOS (Tauri .dmg)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      # N5-A: podium-server is now a bun-compiled sidecar (not a Swift
      # binary) — tauri/prepare-sidecar.sh needs bun on PATH to run
      # `bun install --production` + `bun build --compile`.
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Strip leading "v" from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # tauri.conf.json's "version" is stamped from the tag so the .dmg /
      # .app Info.plist and the (future) T2.3 updater manifest all agree
      # with the GitHub release tag.
      - name: Stamp Tauri app version from tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd tauri/src-tauri
          jq --arg v "$VERSION" '.version = $v' tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp tauri.conf.json
      # P8: the client build embedded in the app MUST be stamped with the
      # real release version too — client/dist is what prepare-sidecar.sh
      # stages into the Tauri bundle as a resource (see tauri/README.md's
      # "--web-dist wire-up" section). Build it explicitly here with the
      # release version before staging, rather than relying on whatever
      # (if anything) happens to already be in client/dist.
      - name: Build client (PODIUM_APP_VERSION stamped)
        env:
          PODIUM_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd client
          npm ci
          npm run build
      - name: Build + stage podium-server sidecar (+ client/dist)
        run: tauri/prepare-sidecar.sh
      # icons/ is git-ignored (build artifact); cargo tauri build panics
      # without it (verified locally — "failed to open icon .../32x32.png").
      - name: Generate app icons
        run: |
          cd tauri
          cargo tauri icon src-tauri/icon-source.png
      - name: Build Tauri app (.app + .dmg)
        run: |
          cd tauri
          cargo tauri build --bundles app,dmg
      # TODO(T2.3): once the Tauri updater signing key exists as a repo
      # secret, add `TAURI_SIGNING_PRIVATE_KEY` / `_PASSWORD` env here so
      # `cargo tauri build` also emits the .app.tar.gz + .sig update
      # artifacts, and generate/upload a `latest.json` updater manifest
      # alongside the .dmg below. Not implemented now — no key exists yet.
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux:
    name: Linux (Tauri .AppImage + .deb)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # GitHub's ubuntu-latest runners are x86_64. `bun build --compile`
      # defaults to compiling for the machine it runs on, so a plain
      # (non-cross) compile here already produces an x86_64 Linux binary —
      # exactly what most Linux desktop users want. No --target flag is
      # needed unless this job is ever changed to cross-compile from a
      # different host arch (e.g. an aarch64 runner); if that happens, pass
      # `--target=bun-linux-x64` explicitly to tauri/prepare-sidecar.sh's
      # `bun build --compile` invocation rather than relying on the host
      # default.
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            patchelf \
            file \
            fuse \
            libfuse2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Strip leading "v" from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Stamp Tauri app version from tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd tauri/src-tauri
          jq --arg v "$VERSION" '.version = $v' tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp tauri.conf.json
      - name: Build client (PODIUM_APP_VERSION stamped)
        env:
          PODIUM_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd client
          npm ci
          npm run build
      - name: Build + stage podium-server sidecar (+ client/dist)
        run: tauri/prepare-sidecar.sh
      # icons/ is git-ignored (build artifact); a fresh CI checkout never has
      # it, so always regenerate (see the macOS job's identical step).
      - name: Generate app icons
        run: |
          cd tauri
          cargo tauri icon src-tauri/icon-source.png
      - name: Build Tauri app (.AppImage + .deb)
        run: |
          cd tauri
          cargo tauri build --bundles appimage,deb
      # TODO(T2.3): same updater-signing slot as the macOS job above —
      # add the Tauri signing key env vars here once it exists, so this
      # job also emits .AppImage.tar.gz + .sig for the updater manifest.
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            tauri/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: artifacts
      # TODO(T2.3): once the updater exists, also generate + attach a
      # `latest.json` updater manifest here (version, per-platform
      # download URLs pointing at this release's assets, and the EdDSA
      # signatures produced by the signing steps above) so the in-app
      # updater has something to poll.
      - name: Create GitHub release (draft)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # download-artifact preserves each artifact's internal layout, and the
          # Linux job uploads two paths (appimage/ + deb/) so its files land under
          # artifacts/appimage/ and artifacts/deb/, not flat. Collect recursively
          # so the nesting doesn't matter.
          mapfile -t assets < <(find artifacts -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \))
          echo "Attaching ${#assets[@]} assets:"; printf '  %s\n' "${assets[@]}"
          test "${#assets[@]}" -gt 0 || { echo "::error::no release assets found under artifacts/"; exit 1; }
          gh release create "${{ github.ref_name }}" "${assets[@]}" \
            --draft \
            --title "${{ github.ref_name }}" \
            --generate-notes
