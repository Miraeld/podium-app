[package]
name = "podium-tauri"
version = "0.1.0"
description = "Podium — native shell for the podium-server dashboard"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
# T2.3: native auto-updater — checks tauri.conf.json's plugins.updater
# endpoint (latest.json) and installs signed updater artifacts.
tauri-plugin-updater = "2"
# Opens external links (A2: sidebar GitHub link, any target="_blank" anchor)
# in the OS browser — tauri-plugin-shell's `Shell::open` is deprecated in
# favor of this.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `json` feature: ws_watcher's agent-event fallback re-derives the active
# count from GET /api/stats via resp.into_json().
ureq = { version = "2", features = ["json"] }
# Blocking WebSocket client for the tray/notification watcher thread — no
# async runtime is pulled in just for this (matches main.rs's sync style).
tungstenite = "0.29"

[target.'cfg(target_os = "macos")'.dependencies]
# Pinned to match the window-vibrancy version tauri itself vendors
# internally (for its macos-private-api feature) — using a different
# semver-incompatible version pulls in a second copy of the same
# Objective-C shims and the linker fails with "symbol multiply defined"
# (duplicate NSVisualEffectView tagged-pointer class registration).
window-vibrancy = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
