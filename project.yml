name: Podium
options:
  bundleIdPrefix: com.gaelrobin
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:

  # ── Main application ─────────────────────────────────────────────────────────
  Podium:
    type: application
    platform: macOS
    bundleIdPrefix: com.gaelrobin
    bundleId: com.gaelrobin.PodiumApp
    deploymentTarget: "26.0"

    sources:
      - path: Sources/PodiumApp
        excludes: []

    entitlements:
      path: PodiumApp.entitlements
      # No App Group capability — the widget fetches from localhost directly.
      # The app target does not need sandbox or App Group for the free path.

    info:
      path: Podium-Info.plist
      properties:
        CFBundleName: Podium
        CFBundleDisplayName: Podium
        CFBundleIdentifier: com.gaelrobin.PodiumApp
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "26.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        # podium:// URL scheme — handled by PodiumApp.swift .onOpenURL
        CFBundleURLTypes:
          - CFBundleURLName: com.gaelrobin.PodiumApp.url
            CFBundleURLSchemes:
              - podium
        # Spotlight / NSUserActivity type for viewSession deep links
        NSUserActivityTypes:
          - com.gaelrobin.PodiumApp.viewSession

    settings:
      base:
        PRODUCT_NAME: Podium
        PRODUCT_BUNDLE_IDENTIFIER: com.gaelrobin.PodiumApp
        INFOPLIST_FILE: Podium-Info.plist
        CODE_SIGN_ENTITLEMENTS: PodiumApp.entitlements
        # Set DEVELOPMENT_TEAM to your Apple Developer Team ID after generating
        # DEVELOPMENT_TEAM: XXXXXXXXXX

    dependencies:
      - target: PodiumWidget
        embed: true

    # No appGroups capability — App Groups require a paid Apple Developer account.
    # The free path does not need them.

  # ── Widget Extension ──────────────────────────────────────────────────────────
  PodiumWidget:
    type: app-extension
    platform: macOS
    bundleId: com.gaelrobin.PodiumApp.widget
    deploymentTarget: "26.0"

    sources:
      # Widget-only code — fully standalone, no shared files with the app target.
      # The widget fetches its own data from localhost:4820 via URLSession.
      # WidgetData.swift is NOT included here: the widget does not use WidgetStore
      # or WidgetSnapshot. (WidgetData.swift in Sources/PodiumApp/ remains in the
      # app target and can be removed in a future cleanup; it is now unused by the widget.)
      - path: PodiumWidget

    entitlements:
      path: PodiumWidget/PodiumWidget.entitlements
      # network.client lets the sandboxed widget reach localhost:4820.
      # Available to FREE personal Apple ID teams — no paid account needed.
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true

    info:
      path: PodiumWidget/PodiumWidget-Info.plist
      properties:
        CFBundleName: PodiumWidget
        CFBundleIdentifier: com.gaelrobin.PodiumApp.widget
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

    settings:
      base:
        PRODUCT_NAME: PodiumWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.gaelrobin.PodiumApp.widget
        INFOPLIST_FILE: PodiumWidget/PodiumWidget-Info.plist
        CODE_SIGN_ENTITLEMENTS: PodiumWidget/PodiumWidget.entitlements
        SKIP_INSTALL: YES
        # Set DEVELOPMENT_TEAM to your Apple Developer Team ID after generating
        # DEVELOPMENT_TEAM: XXXXXXXXXX

    # No appGroups capability — not needed on the free path.
